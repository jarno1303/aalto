name: Android quality gate

on:
  push:
    branches:
      - main
      - beta-hardening-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew app:lintDebug --stacktrace

      - name: Full build
        run: ./gradlew app:build --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-gate-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/
